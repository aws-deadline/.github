name: "CodeQL"

on:
  workflow_call:
    inputs:
        languages:
          description: "Provide a comma seperated list. Supported languages are: python, typescript, javascript, go, java, cpp, csharp, ruby."
          required: false
          type: string
          default: "python"
        mode:
          description: "Supports none, autobuild or manual." 
          required: false
          type: string
          default: none

jobs:
  analyze:
    name: Analyze (${{inputs.languages}})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    
     # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        queries: +security-and-quality
        languages: ${{inputs.languages}}
        build-mode: ${{inputs.mode }}
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
