name: "CodeQL"

on:
  workflow_call:
    inputs:
        languages:
          description: "Provide a comma seperated list. Supported languages are: python, typescript, javascript, go, java, cpp, csharp, ruby."
          required: false
          type: string
          default: "python"
        mode:
          description: "Supports none, autobuild or manual." 
          required: false
          type: string
          default: none

jobs:
  analyze:
    name: Analyze (${{inputs.languages}})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
     # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        queries: +security-and-quality
        languages: ${{inputs.languages}}
        build-mode: ${{inputs.mode }}
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
