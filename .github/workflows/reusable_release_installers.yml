on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      oses:
        required: true
        type: string
      project_name:
        required: true
        type: string

jobs:
  ReleaseInstaller:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    strategy:
      matrix:
        os: ${{ fromJson(inputs.oses) }}    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_CODEBUILD_MAINLINE_INSTALLER_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true
      - name: Run CodeBuild
        uses: aws-actions/aws-codebuild-run-build@7e46c3fa1c1f217e26a73712796b1f78938b534b # v1.0.18
        with:
          project-name: ReleaseInstallerProject
          hide-cloudwatch-logs: true
          env-vars-for-codebuild: |
              REPONAME,
              OPERATING_SYSTEM,
              VERSION
        env:
          REPONAME: ${{ inputs.project_name }}
          OPERATING_SYSTEM: ${{ matrix.os }}
          VERSION: ${{ inputs.tag }}