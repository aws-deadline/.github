name: Reusable Label PR

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
        description: "The PR number to label"
      label_name:
        required: false
        type: string
        default: "waiting-on-maintainers"
        description: "The label to add to the PR"

permissions:
  pull-requests: write

jobs:
  add-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add label to PR
        run: |
          echo "Adding label '$LABEL_NAME' to PR #$PR_NUMBER"
          gh pr edit "$PR_NUMBER" --add-label "$LABEL_NAME" --repo "$REPO"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pass inputs via env, not inline ${{ }}, to avoid template injection.
          PR_NUMBER: ${{ inputs.pr_number }}
          LABEL_NAME: ${{ inputs.label_name }}
          REPO: ${{ github.repository }}
