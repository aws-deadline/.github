# Caching strategy:
# - pip download cache and hatch virtualenv cache are always enabled.
# - The cache key includes OS, Python version, and hashes of all dependency files so it
#   auto-busts when deps change.
# - Release artifacts (PyPI packages, installers) are built in separate jobs with clean
#   environments, so the cache does not affect published artifacts.
name: Python Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      commit:
        required: false
        type: string
      ref:
        required: false
        type: string
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string

jobs:
  Python:
    name: ${{ inputs.os }}, python ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    env:
      PYTHON: ${{ inputs.python-version }}
      PY_COLORS: 1
      HATCH_DATA_DIR: ${{ github.workspace }}/.hatch-data
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ !inputs.branch && !inputs.commit && !inputs.ref }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ inputs.branch }}
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ inputs.commit }}
      with:
        ref: ${{ inputs.commit }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ inputs.ref }}
      with:
        ref: ${{ inputs.ref }}

    - name: setup ${{ inputs.os }}
      if: inputs.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 \
          x11-utils libxcb-cursor0 libopengl0

    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Restore Hatch environment cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.hatch-data/env
        # Include the full patch version so the cache busts when the runner image
        # rolls to a new patch (e.g. 3.14.4 -> 3.14.5). Otherwise the cached venv's
        # console-script shebangs point at a removed interpreter and tools like
        # mypy fail with "command not found".
        key: hatch-env-${{ inputs.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'hatch.toml', 'requirements*.txt') }}

    # pip 26.2.2 requires Python 3.10+, but this workflow still tests Python 3.9.
    # Use the patched uv release for both the initial install and Hatch environments.
    - name: Set up uv 0.13.4
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: "0.13.4"

    # Hatch environments created by uv do not contain a pip executable. Route
    # repositories' existing `pip` commands through the pinned uv installation.
    - name: Route pip commands through uv
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path

        shim_dir = Path(os.environ["RUNNER_TEMP"]) / "uv-pip-shim"
        shim_dir.mkdir(exist_ok=True)
        (shim_dir / "pip").write_text('#!/bin/sh\nexec uv pip "$@"\n')
        (shim_dir / "pip").chmod(0o755)
        (shim_dir / "pip.cmd").write_text("@echo off\r\nuv pip %*\r\n")
        with open(os.environ["GITHUB_PATH"], "a") as github_path:
            github_path.write(f"{shim_dir}\n")
        PY

    - name: Install Hatch
      shell: bash
      run: |
        uv pip install --system --upgrade hatch 'virtualenv<21; python_version < "3.10"'
        python -c "import os, shutil; open(os.environ['GITHUB_ENV'], 'a').write(f'HATCH_ENV_TYPE_VIRTUAL_UV_PATH={shutil.which(\"uv\")}\n')"

    - name: Run Linting
      run: hatch -v run lint

    - name: Run Build
      run: hatch -v build

    - name: Run Tests
      run: hatch run test
