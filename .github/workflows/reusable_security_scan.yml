# Reusable security-scan umbrella workflow.
#
# This is the single, central place where repo-agnostic security checks live.
# Repos call it from a thin stub (see security_scan.yml in each repo), so new
# checks can be added here as additional jobs WITHOUT having to edit every repo.
#
# Current checks:
#   - zizmor: static analysis of GitHub Actions workflows (https://zizmor.sh)
#
# To add a future check: add a new job below, optionally gated behind a new
# `workflow_call` input (defaulting to enabled), and it will apply everywhere
# the stub is present on the next run.
name: "Security Scan"

on:
  workflow_call:
    inputs:
      zizmor:
        description: "Run the zizmor GitHub Actions static analysis check."
        required: false
        type: boolean
        default: true
      min-severity:
        description: >-
          Minimum finding severity that fails the check. Findings at or above
          this level are reported in the step log and fail the job; anything
          below is not reported. Defaults to 'high' so PRs are gated on serious
          findings without being red-walled by hygiene noise. Lower it (e.g.
          'medium') once a repo's high-severity backlog is at zero.
          One of: unknown, informational, low, medium, high.
        required: false
        type: string
        default: high

permissions: {}

jobs:
  zizmor:
    name: zizmor (GitHub Actions)
    if: ${{ inputs.zizmor }}
    runs-on: ubuntu-latest
    permissions:
      # Findings are reported to the step log / PR annotations, not the Security
      # tab, so no security-events permission is needed.
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch central zizmor config
        # The zizmor.yml policy lives once in aws-deadline/.github and is shared
        # by every repo, so a single edit there updates policy fleet-wide.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: aws-deadline/.github
          ref: mainline
          path: .zizmor-config
          persist-credentials: false

      - name: Run zizmor 🌈
        # zizmor exits non-zero when it reports findings, so the job fails on any
        # finding at or above min-severity. No continue-on-error: the check is a
        # gate, not advisory.
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          # Scope to .github/ so the nested central-config checkout at
          # .zizmor-config/ is not itself scanned. All workflows and composite
          # actions live under .github/, so coverage is complete.
          inputs: .github/
          config: .zizmor-config/zizmor.yml
          min-severity: ${{ inputs.min-severity }}
          # Report findings in the run log and as inline PR annotations rather
          # than uploading SARIF to the Security tab.
          advanced-security: false
          annotations: true
